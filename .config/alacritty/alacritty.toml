# ~/.config/alacritty/alacritty.toml

[env]
TERM = "xterm-256color"

[font]
size = 12.0

[font.normal]
family = "Inconsolata"
style = "Regular"

[font.bold]
family = "Inconsolata"
style = "Bold"

[window]
padding = { x = 4, y = 2 }

[cursor]
style = { shape = "Block", blinking = "Off" }

[colors]
# fonts-inconsolata ships a single Medium-weight face, so [font.bold]'s
# "Bold" style request just fontconfig-matches back to the same file --
# there is no bold weight to render. Distinguish bold via color instead.
draw_bold_text_with_bright_colors = true

# Solarized Dark
[colors.primary]
background = "#002b36"
foreground = "#839496"
bright_foreground = "#93a1a1"
dim_foreground = "#586e75"

[colors.cursor]
text = "#002b36"
cursor = "#839496"

[colors.selection]
background = "#073642"
text = "CellForeground"

[colors.normal]
black = "#073642"
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#d33682"
cyan = "#2aa198"
white = "#eee8d5"

[colors.bright]
black = "#586e75"
red = "#cb4b16"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#6c71c4"
cyan = "#2aa198"
white = "#fdf6e3"
